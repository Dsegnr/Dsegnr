    <style>
      .draw{animation:draw 2.6s cubic-bezier(.22,.61,.36,1) .3s both}
      @keyframes draw{from{stroke-dasharray:1600;stroke-dashoffset:1600}to{stroke-dasharray:1600;stroke-dashoffset:0}}
      .node{animation:pop .55s ease-out both}
      @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
      .halo{animation:pulse 3s ease-out 3s infinite}
      @keyframes pulse{0%{r:9px;opacity:.30}70%{r:26px;opacity:0}100%{r:26px;opacity:0}}
      .pulse{animation:flow 5.4s linear 3s infinite}
      @keyframes flow{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
      .contourA{animation:driftA 17s ease-in-out infinite alternate}
      @keyframes driftA{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
      .contourB{animation:driftB 23s ease-in-out infinite alternate}
      @keyframes driftB{from{transform:translateX(15px)}to{transform:translateX(-15px)}}
      .sheen{animation:sweep 12s linear 1.5s infinite}
      @keyframes sweep{from{transform:translateX(-340px)}to{transform:translateX(1540px)}}
      .breathe{animation:breathe 7.5s ease-in-out infinite}
      @keyframes breathe{0%,100%{opacity:.82}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.draw,.node,.halo,.pulse,.contourA,.contourB,.sheen,.breathe{animation:none}}
    </style>
