name: Metrics

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Metrics (dark theme)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Dsegnr
          filename: github-metrics.svg
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: Asia/Shanghai
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%
          extras_css: |
            svg { color: #8C9AA1 }
            h1, h2, h3 { color: #F2B705 }
            path[fill="#ebedf0"], .day[fill="#ebedf0"] { fill: #1B2126 }
            path[fill="#9be9a8"], .day[fill="#9be9a8"] { fill: #4A3B0A }
            path[fill="#40c463"], .day[fill="#40c463"] { fill: #8A6A0F }
            path[fill="#30a14e"], .day[fill="#30a14e"] { fill: #C79A08 }
            path[fill="#216e39"], .day[fill="#216e39"] { fill: #F2B705 }

      - name: Metrics (light theme)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Dsegnr
          filename: github-metrics-light.svg
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: Asia/Shanghai
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%
          extras_css: |
            svg { color: #57606A }
            h1, h2, h3 { color: #A8790A }
            path[fill="#ebedf0"], .day[fill="#ebedf0"] { fill: #EDF1F4 }
            path[fill="#9be9a8"], .day[fill="#9be9a8"] { fill: #FBE9B0 }
            path[fill="#40c463"], .day[fill="#40c463"] { fill: #F5D477 }
            path[fill="#30a14e"], .day[fill="#30a14e"] { fill: #E9B92F }
            path[fill="#216e39"], .day[fill="#216e39"] { fill: #C99400 }

      - name: Publish metrics to the profile site
        env:
          PUSH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -e
          git fetch --depth 1 origin main
          git checkout origin/main -- github-metrics.svg github-metrics-light.svg
          git clone --depth 1 "https://x-access-token:${PUSH_TOKEN}@github.com/Dsegnr/Dsegnr.github.io.git" pages
          mkdir -p pages/metrics
          cp github-metrics.svg github-metrics-light.svg pages/metrics/
          cd pages
          git config user.name "Dsegnr"
          git config user.email "3660157476@qq.com"
          git add metrics
          if git diff --staged --quiet; then
            echo "metrics unchanged"
          else
            git commit -q -m "Update profile metrics"
            git push -q
          fi
